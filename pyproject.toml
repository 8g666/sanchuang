[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docguard-rag"
version = "0.6.0"
description = "General-purpose document RAG and quality review service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx>=0.27",
    "alembic>=1.13",
    "pydantic-settings",
    "python-multipart",
    "sqlalchemy",
    "numpy",
    "pypdf>=5"
]

[project.scripts]
docguard-rag = "docguard_rag.cli:main"

[project.optional-dependencies]
distributed = [
    "celery[redis]>=5.4"
]
dev = [
    "pytest",
    "httpx",
    "ruff"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.packages.find]
where = ["."]
include = ["docguard_rag*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"docguard_rag.migrations" = ["script.py.mako", "alembic.ini"]
